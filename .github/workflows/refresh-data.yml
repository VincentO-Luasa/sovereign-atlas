name: Refresh IMF / World Bank data

# Re-pulls the public datasets monthly and opens a commit if anything changed.
# Curated files in data/curated (ratings, market snapshot, IMF programmes) are not touched.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/countries.json
          git diff --cached --quiet || git commit -m "chore(data): monthly IMF / World Bank refresh"
          git push
